<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>뷰포트 진단</title>
    <style>
      /* 앱과 같은 조건을 만든다 — Expo가 깔아두는 규칙 + 우리가 덮은 dvh */
      #root, body, html { height: 100%; }
      @supports (height: 100dvh) {
        html, body, #root { height: 100dvh; }
      }
      body { margin: 0; font: 15px/1.5 -apple-system, system-ui, sans-serif; }
      #root { display: flex; flex-direction: column; position: relative; background: #f6f8fa; }
      h1 { font-size: 17px; margin: 12px 16px 4px; }
      table { border-collapse: collapse; margin: 0 16px; width: calc(100% - 32px); }
      td { padding: 5px 4px; border-bottom: 1px solid #dee3e7; font-variant-numeric: tabular-nums; }
      td:first-child { color: #4b5765; }
      td:last-child { text-align: right; font-weight: 700; }
      .verdict { margin: 12px 16px; padding: 10px 12px; border-radius: 10px; font-weight: 700; }
      .ok { background: #dff6de; color: #007a17; }
      .bad { background: #ffe7d9; color: #b83d00; }
      /* 앱 탭바와 같은 방식으로 배치 — 이게 툴바에 가리는지 보는 게 핵심 */
      .tabbar {
        position: absolute; left: 24px; right: 24px; bottom: 12px; height: 56px;
        background: #141f2c; color: #fff; border-radius: 28px;
        display: flex; align-items: center; justify-content: center; font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <h1>뷰포트 진단</h1>
      <table id="t"></table>
      <div id="v" class="verdict"></div>
      <div class="tabbar">이 막대가 온전히 보이나요?</div>
    </div>
    <script>
      function px(el, prop) {
        return getComputedStyle(el)[prop];
      }
      function render() {
        const vv = window.visualViewport;
        const root = document.getElementById('root');
        // 100dvh와 100vh가 실제로 몇 px인지 재본다
        const probe = document.createElement('div');
        probe.style.cssText = 'position:absolute;visibility:hidden;height:100dvh';
        document.body.appendChild(probe);
        const dvh = probe.getBoundingClientRect().height;
        probe.style.height = '100vh';
        const vh = probe.getBoundingClientRect().height;
        probe.remove();

        const rows = [
          ['window.innerHeight', window.innerHeight],
          ['visualViewport.height', vv ? Math.round(vv.height) : '없음'],
          ['visualViewport.offsetTop', vv ? Math.round(vv.offsetTop) : '없음'],
          ['documentElement.clientHeight', document.documentElement.clientHeight],
          ['100vh 실측', Math.round(vh)],
          ['100dvh 실측', Math.round(dvh)],
          ['#root 최종 높이', px(root, 'height')],
          ['dvh 지원', CSS.supports('height', '100dvh') ? '예' : '아니오'],
          ['safe-area-inset-bottom', getComputedStyle(document.documentElement).getPropertyValue('--sab') || '(아래 참고)'],
        ];
        document.getElementById('t').innerHTML = rows
          .map((r) => '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>')
          .join('');

        const v = document.getElementById('v');
        const rootH = parseFloat(px(root, 'height'));
        const visible = vv ? vv.height : window.innerHeight;
        if (Math.abs(rootH - visible) <= 2) {
          v.className = 'verdict ok';
          v.textContent = '루트 높이 = 보이는 높이 → 탭바가 툴바 위에 앉아야 정상';
        } else {
          v.className = 'verdict bad';
          v.textContent = '루트가 보이는 높이보다 ' + Math.round(rootH - visible) + 'px 큼 → 그만큼 툴바 뒤로 들어감';
        }
      }
      render();
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', render);
        window.visualViewport.addEventListener('scroll', render);
      }
      window.addEventListener('resize', render);
    </script>
  </body>
</html>
