<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>뷰포트 진단</title>
    <style>
      /* 앱과 똑같은 조건을 만든다 — expo-reset이 body{overflow:hidden}까지 건다.
         이걸 빼놓고 보다가 '문서가 밀린다'고 오판했다(2026-08-24). */
      #root, body, html { height: 100%; }
      body { overflow: hidden; }
      #root { display: flex; }
      html, body, #root { height: 100vh; }
      body { margin: 0; font: 15px/1.5 -apple-system, system-ui, sans-serif; }
      #root { flex-direction: column; position: relative; background: #f6f8fa; overflow-y: auto; }
      h1 { font-size: 17px; margin: 12px 16px 4px; }
      table { border-collapse: collapse; margin: 0 16px; width: calc(100% - 32px); }
      td { padding: 5px 4px; border-bottom: 1px solid #dee3e7; font-variant-numeric: tabular-nums; }
      td:first-child { color: #4b5765; }
      td:last-child { text-align: right; font-weight: 700; }
      .verdict { margin: 12px 16px; padding: 10px 12px; border-radius: 10px; font-weight: 700; }
      .ok { background: #dff6de; color: #007a17; }
      .bad { background: #ffe7d9; color: #b83d00; }
      /* 페이지가 주소창 뒤까지 차는지 눈으로 보기 위한 줄무늬 */
      .filler {
        flex: 1; margin-top: 8px; padding: 8px 16px; color: #4b5765; font-size: 13px;
        background: repeating-linear-gradient(45deg, #cfe3ff 0 14px, #eaf3ff 14px 28px);
      }
      /* 앱 탭바와 같은 방식(fixed) — 이게 툴바 위에 앉는지 보는 게 핵심 */
      .tabbar {
        position: fixed; left: 24px; right: 24px; bottom: 12px; height: 56px;
        background: #141f2c; color: #fff; border-radius: 28px;
        display: flex; align-items: center; justify-content: center; font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <h1>뷰포트 진단</h1>
      <table id="t"></table>
      <div id="v" class="verdict"></div>
      <div class="filler">줄무늬이 주소창 <b>뒤까지</b> 비치면 정상 ↓</div>
      <div class="tabbar">이 막대가 주소창 위에 온전히 보이면 OK</div>
    </div>
    <script>
      function px(el, prop) {
        return getComputedStyle(el)[prop];
      }
      function render() {
        const vv = window.visualViewport;
        const root = document.getElementById('root');
        // 100dvh와 100vh가 실제로 몇 px인지 재본다
        const probe = document.createElement('div');
        probe.style.cssText = 'position:absolute;visibility:hidden;height:100dvh';
        document.body.appendChild(probe);
        const dvh = probe.getBoundingClientRect().height;
        probe.style.height = '100vh';
        const vh = probe.getBoundingClientRect().height;
        probe.remove();

        const rows = [
          ['window.innerHeight', window.innerHeight],
          ['visualViewport.height', vv ? Math.round(vv.height) : '없음'],
          ['visualViewport.offsetTop', vv ? Math.round(vv.offsetTop) : '없음'],
          ['documentElement.clientHeight', document.documentElement.clientHeight],
          ['100vh 실측', Math.round(vh)],
          ['100dvh 실측', Math.round(dvh)],
          ['#root 최종 높이', px(root, 'height')],
          ['dvh 지원', CSS.supports('height', '100dvh') ? '예' : '아니오'],
          ['실제 밀림(0이어야 정상)', (() => { const b = window.scrollY; window.scrollTo(0, 999); const m = window.scrollY; window.scrollTo(0, b); return Math.round(m); })()],
          ['safe-area-inset-bottom', getComputedStyle(document.documentElement).getPropertyValue('--sab') || '(아래 참고)'],
        ];
        document.getElementById('t').innerHTML = rows
          .map((r) => '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>')
          .join('');

        const v = document.getElementById('v');
        const rootH = parseFloat(px(root, 'height'));
        const visible = vv ? vv.height : window.innerHeight;
        // 문서 스크롤이 0이어야 한다 — 루트가 보이는 영역보다 크면 페이지가 밀려
        // 헤더가 상태바 밑으로 들어가고, 정작 넘친 부분은 주소창이 덮어 볼 수도 없다.
        // 높이 차이만 보면 안 된다 — overflow:hidden이면 차이가 있어도 실제로는 안 밀린다.
        // 진짜로 밀어보고 얼마나 움직이는지 잰다.
        const before = window.scrollY;
        window.scrollTo(0, 999);
        const moved = window.scrollY;
        window.scrollTo(0, before);
        const docScroll = moved;
        const over = Math.round(rootH - visible);
        if (over > 2 && docScroll <= 1) {
          v.className = 'verdict ok';
          v.textContent = '루트가 보이는 높이보다 ' + over + 'px 큼 → 주소창 뒤까지 참 / 문서 스크롤 0 → 페이지 안 밀림';
        } else if (over <= 2) {
          v.className = 'verdict bad';
          v.textContent = '루트 = 보이는 높이 → 주소창 뒤가 빈채로 남는다';
        } else {
          v.className = 'verdict bad';
          v.textContent = '문서가 ' + Math.round(docScroll) + 'px 스크롤됨 → 페이지가 밀린다';
        }
      }
      render();
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', render);
        window.visualViewport.addEventListener('scroll', render);
      }
      window.addEventListener('resize', render);
    </script>
  </body>
</html>
