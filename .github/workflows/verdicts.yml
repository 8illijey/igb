name: Build verdicts

# 평년+최근1년 두 기준 판정을 하루 1회 사전계산해 verdicts.json 커밋.
# (GitHub 러너는 KAMIS 접속 가능 — 로컬/CI 외 환경은 차단됨)
on:
  schedule:
    # GitHub cron은 지연·통째 누락이 잦다 — 2026-08-28 실사고: 전날 16:05 예약이 11시간
    # 밀려 새벽 3시에 돌고(=전날 데이터로 빌드), 당일 예약은 22시까지 미실행이라
    # 차트가 하루 종일 전날짜였다. 시간대를 벌려 3번 걸고, guard 잡이 이미 성공한
    # 날은 건너뛴다. health.yml도 매시 신선도를 보고 미생성 시 재발화한다(워치독).
    # 16:30 첫 회차 — KAMIS는 오후 4시에 갱신되지만 기간별 API는 품목마다 게시가 늦다.
    # 16:05는 너무 일러 절반만 받았다(2026-09-09). 30분 뒤로 미뤄 1차 수확률을 올린다.
    - cron: '30 7 * * *' # 16:30 KST — 1차
    - cron: '30 8 * * *' # 17:30 KST — 2차(늦게 올라온 품목 보충)
    - cron: '30 9 * * *' # 18:30 KST — 3차(보충·누락 대비)
  workflow_dispatch:
    inputs:
      force:
        description: '가드 무시하고 강제 재빌드'
        type: boolean
        default: false

# 두 실행이 겹치면 뒤의 push가 거부된다(밀린 cron+워치독 재발화가 동시에 돌 수 있음) — 직렬화.
# 대기열에 있다 늦게 시작한 실행은 앞 실행이 푸시한 신선본을 guard가 보고 스킵한다.
concurrency:
  group: verdicts-build
  cancel-in-progress: false

jobs:
  # '오늘 KST 16시 이후 생성분'이 이미 main에 있으면 빌드 전체를 스킵.
  # 체크아웃 파일이 아니라 contents API로 '지금의 main'을 읽는다 — 대기열에 있다
  # 시작된 실행은 github.sha가 트리거 시점에 고정돼 방금 푸시된 신선본을 못 보고,
  # raw CDN은 푸시 후 수 분 캐시가 남는다. API는 둘 다 없다(2026-08-28 리뷰).
  # 날짜만 보면 안 된다 — 밀린 cron이 새벽에 돌면 generatedAt은 오늘이지만
  # 내용은 전날 데이터다(16시 KAMIS 갱신 전이므로). 시각까지 본다.
  # 한계(의도적): generatedAt은 빌드 시각이지 KAMIS 발행 확인이 아니다 — KAMIS가
  # 16시를 크게 넘겨 발행하는 날은 stale을 fresh로 볼 수 있다. 데이터 날짜 검사로
  # 바꾸면 주말·공휴일(미조사일)에 헛빌드가 반복돼 채택하지 않았다.
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: check
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "강제 재빌드 — 가드 생략"; exit 0
          fi
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/$GITHUB_REPOSITORY/contents/mobile/public/series.json?ref=main" \
            > /tmp/series-main.json 2>/dev/null || true
          gen=$(jq -r '.generatedAt // empty' /tmp/series-main.json 2>/dev/null || true)
          [ -n "$gen" ] \
            && [ "$(TZ=Asia/Seoul date -d "$gen" +%F)" = "$(TZ=Asia/Seoul date +%F)" ] \
            && [ "$(TZ=Asia/Seoul date -d "$gen" +%-H)" -ge 16 ] \
            && today_build=1 || today_build=0

          # 시각만 보면 안 된다 — KAMIS 기간별 API(periodProductList)는 품목마다 오늘치가 올라오는
          # 시각이 다르다. 16:05 회차는 갱신 직후라 절반만 오늘치를 받고, 그런데도 시각 조건만으로
          # 17:35·19:35 회차가 전부 스킵돼 나머지 품목은 차트·기준일이 하루 종일 어제로 남았다
          # (2026-09-09 제보: 참외·고구마·팚 등 90개 중 44개가 09-08에 멈춤). 그래서 신선도도 본다 —
          # 품목들의 마지막 점 중 가장 최신 날짜를 조사일로 보고, 그날까지 채워진 품목 비율을 재다.
          # 조사일을 데이터에서 도출하므로 주말·공휴일(미조사)에도 비율이 낮아지지 않는다.
          # 80% 기준: KAMIS가 조사를 멈춘 품목(사과 일부·닭고기 절단육 등 ~8개)은 영원히 안 차서
          # 최대치가 ~91%다. 절반(51%)과 정상(91%)을 가른다.
          fresh_pct=0
          if [ -s /tmp/series-main.json ]; then
            read -r f t <<<"$(jq -r '[.items[] | (.r // []) | select(length > 0) | .[-1][0]] as $d
              | ($d | max) as $m
              | [($d | map(select(. == $m)) | length), ($d | length)] | @tsv' /tmp/series-main.json 2>/dev/null || echo "0 0")"
            if [ "${t:-0}" -gt 0 ]; then fresh_pct=$(( f * 100 / t )); fi
          fi

          if [ "$today_build" = 1 ] && [ "$fresh_pct" -ge 80 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "오늘 16시 이후 빌드($gen) + 시계열 신선도 ${fresh_pct}% — 스킵"
          elif [ "$today_build" = 1 ]; then
            echo "오늘 빌드는 있지만 시계열 신선도가 ${fresh_pct}%라 늦게 올라온 품목을 채우러 재빌드한다"
          fi

  build:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # verdicts.json 커밋용
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # 고정 SHA가 아니라 시작 시점의 main에서 빌드 — 대기열에서 늦게 시작해도 최신 스크립트로 돈다
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # gen-seo.mjs가 src/api/kamis.ts를 그대로 import한다 — TS 타입 스트리핑은 22+ 필요
      - name: Build verdicts.json
        working-directory: mobile
        env:
          # KAMIS 직접 호출은 해외 러너 IP에서 막힐 수 있어 워커 프록시 경유 — 키는 워커에 있어 시크릿 불필요.
          KAMIS_PROXY: https://igeobissa-recipes.designerxyzi.workers.dev/kamis
        run: node scripts/build-verdicts.mjs
      # 검색엔진용 품목 목록·사이트맵 — KAMIS 품목이 늘거나 품종이 바뀌면 상세 정적 페이지와
      # sitemap이 같이 따라가야 한다. verdicts와 같은 회차에 돌려 한 번에 커밋한다.
      - name: Build SEO data
        working-directory: mobile
        # kamis.ts는 워커 URL이 하드코딩돼 있어 KAMIS_PROXY가 필요 없다.
        run: node scripts/gen-seo.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mobile/public/verdicts.json mobile/public/series.json mobile/src/seo.gen.ts mobile/src/snapshot.gen.ts mobile/public/robots.txt mobile/public/sitemap.xml mobile/public/llms.txt
          git commit -m "chore: update verdicts $(date -u +%F)" || { echo "변동 없음"; exit 0; }
          # 빌드 도는 15분 사이 main에 다른 커밋이 오면 push가 거부된다(2026-08-28 실사고) — 리베이스로 흡수.
          # 생성 파일이 충돌하면 새 빌드가 이긴다(-X theirs: rebase에선 재적용되는 우리 커밋이 theirs).
          # 사람이 생성 파일을 손으로 고친 커밋은 덮일 수 있다 — 생성 파일은 봇 소유가 원칙.
          git pull --rebase -X theirs origin main
          git push
      # 매일 성공 핑 1건 — '이 메시지가 안 오면 이상'이라는 양성 신호(무소식=정상이 아니라
      # 무소식=의심). guard 스킵 회차는 build 잡이 안 돌아 핑이 중복되지 않는다.
      #
      # 핑은 '커밋됨'이 아니라 '사이트에 보임'을 알린다 — 커밋 직후 쏘면 Vercel 재배포가
      # 끝나기 전이라 알림을 보고 앱을 열면 어제 데이터가 보인다(2026-09-09 제보: 16:26
      # 커밋·핑 → 16:28에도 사이트는 09-08, 16:32에야 09-09). 그래서 실제 서빙되는
      # verdicts.json의 generatedAt이 방금 빌드한 값과 같아질 때까지 기다렸다 보낸다.
      - name: Discord 알림 (오늘자 반영)
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          [ -n "$HOOK" ] || exit 0
          # 주말·공휴일은 KAMIS 미조사라 '오늘자'가 아니다 — 조사일을 있는 그대로 말한다(2026-09-06 제보).
          SURVEY=$(jq -r '.date // empty' mobile/public/verdicts.json)
          GEN=$(jq -r '.generatedAt // empty' mobile/public/verdicts.json)
          TODAY=$(TZ=Asia/Seoul date +%F)

          # 채움률 — 이번 회차 series.json에서 '조사일까지 채워진 품목 / 전체'.
          # guard의 재빌드 판정과 같은 계산식이라, 핑의 숫자를 보면 다음 회차가 또 돌지 알 수 있다
          # (80% 미만이면 다음 예약 회차가 스킵하지 않고 보충한다).
          FILL_TXT=""
          read -r F T <<<"$(jq -r '[.items[] | (.r // []) | select(length > 0) | .[-1][0]] as $d
            | ($d | max) as $m
            | [($d | map(select(. == $m)) | length), ($d | length)] | @tsv' mobile/public/series.json 2>/dev/null || echo "0 0")"
          if [ "${T:-0}" -gt 0 ]; then
            PCT=$(( F * 100 / T ))
            if [ "$PCT" -ge 80 ]; then
              FILL_TXT=" · 품목 ${F}/${T}(${PCT}%) 반영"
            else
              FILL_TXT=" · 품목 ${F}/${T}(${PCT}%)만 반영 — 나머지는 다음 회차에 보충해요"
            fi
          fi

          # 배포 반영 대기 — 20초 간격 30회(최대 10분). 캐시를 피하려 쿼리스트링을 매번 바꾼다.
          DEPLOYED=0
          for _ in $(seq 1 30); do
            LIVE=$(curl -s -m 15 "https://igeobissa.com/verdicts.json?ci=$(date +%s)" | jq -r '.generatedAt // empty' 2>/dev/null || true)
            if [ -n "$GEN" ] && [ "$LIVE" = "$GEN" ]; then DEPLOYED=1; break; fi
            sleep 20
          done

          NOW=$(TZ=Asia/Seoul date '+%m/%d %H:%M')
          if [ "$DEPLOYED" = 1 ]; then
            if [ "$SURVEY" = "$TODAY" ]; then
              MSG="✅ 오늘자 시세 반영 완료 — 앱에서 확인 가능 ($NOW)${FILL_TXT}"
            else
              MSG="✅ 시세 반영 완료 — 조사일 ${SURVEY:-확인불가} 기준, 앱에서 확인 가능 ($NOW)${FILL_TXT}"
            fi
          else
            # 빌드·커밋은 됐는데 10분 안에 사이트가 안 바뀐 경우 — 거짓 '완료'를 보내지 않는다.
            MSG="⏳ 시세 빌드는 끝났는데 배포가 10분 넘게 안 붙었어요 (조사일 ${SURVEY:-확인불가})${FILL_TXT} — Vercel 배포 확인 필요"
          fi
          curl -sf -m 10 -H 'Content-Type: application/json' \
            -d "{\"content\":\"$MSG\"}" "$HOOK" || true
      - name: Discord 알림 (빌드 실패)
        if: failure()
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          [ -n "$HOOK" ] || exit 0
          curl -sf -m 10 -H 'Content-Type: application/json' \
            -d "{\"content\":\"🚨 **verdicts 빌드 실패** — 오늘자 갱신이 만들어지지 않았어요. 로그: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" \
            "$HOOK" || true
