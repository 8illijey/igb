name = "igeobissa-recipes"
main = "src/index.ts"
compatibility_date = "2026-06-01"

# 매주 화요일 04:00 KST (= 월요일 19:00 UTC) 에 레시피 재생성
[triggers]
crons = ["0 19 * * 1"]

# 생성 결과 캐시. `wrangler kv namespace create RECIPES_KV` 로 만들고 id를 채운다.
[[kv_namespaces]]
binding = "RECIPES_KV"
id = "9012892bbb7c4e828f07a97d0854c334"
