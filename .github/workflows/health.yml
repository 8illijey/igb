name: Health check

# 프로덕션 상시 감시 — 실패하면 GitHub이 자동으로 메일 알림.
# 잡는 것: 앱 다운 / 시세 전무(라이브·stale 모두 없음) / stale 5일 초과(상류 장기 장애) / verdicts CI 침묵.
# 2026-07-15~17 KAMIS 방화벽 UA 차단 장애(백지 사이트를 사람이 발견) 재발 방지.
on:
  schedule:
    - cron: '23 * * * *' # 매시
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      actions: write # 7) 워치독이 verdicts CI를 재발화(workflow_dispatch)하는 데 필요
    steps:
      - name: Check production
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fail=0
          today=$(date -u -d '+9 hours' +%F)  # KST

          # 순간 장애로 헛알람이 뜼지 않게 — 판정을 최대 3회, 8초 간격으로 다시 본다.
          # 2026-08-21 09:01 실패(#506)이 그랬다 — 같은 실행의 부류 검사는 통과했는데
          # 평년 검사만 0행이었고, 다음 회차부터 5번 연속 정상이었다.
          # 기준 자체는 그대로다 — 지속 장애는 3회 모두 실패하므로 여전히 잡힌다.
          # 사용법: retry '<명령문>' '<통과 조건(변수 v)>'  → 마지막 값이 $v에 남는다.
          retry() {
            local cmd="$1" cond="$2"
            for _ in 1 2 3; do
              v=$(eval "$cmd")
              if eval "$cond"; then return 0; fi
              sleep 8
            done
            return 1
          }

          # 1) 앱 HTML — 대표 도메인 기준. 2026-08-17에 커스텀 도메인을 붙이며
          #    igeobissa.vercel.app을 igeobissa.com으로 308 리다이렉트시켰다. 옛 주소를 그대로
          #    검사하다 308을 받고 매시간 실패했으므로 대표 주소를 본다(리다이렉트도 따라간다).
          retry "curl -sL -o /dev/null -w '%{http_code}' -m 20 https://igeobissa.com" '[ "$v" = 200 ]' \
            || { echo "::error::앱 HTTP $v"; fail=1; }

          # 2) 홈 시세 4개 부류 — 라이브든 stale이든 행이 있어야 함. stale이 5일 넘게 묵으면 실패.
          for cat in 100 200 400 500; do
            CAT_URL="https://igeobissa-recipes.designerxyzi.workers.dev/kamis?action=dailyPriceByCategoryList&p_product_cls_code=01&p_item_category_code=$cat&p_country_code=1101&p_regday=$today&p_convert_kg_yn=N"
            # 응답을 파일로 받아 두면 통과 후 본문·헤더를 다시 받을 필요가 없다(상류 호출 절반).
            if ! retry "curl -s -m 25 -D /tmp/hdr-$cat -o /tmp/body-$cat '$CAT_URL'; jq -r '.data.item | length' /tmp/body-$cat 2>/dev/null || echo 0" '[ "${v:-0}" -gt 0 ]'; then
              echo "::error::부류 $cat 시세 0행 (라이브·stale 모두 없음)"; fail=1; continue
            fi
            body=$(cat /tmp/body-$cat)
            if grep -qi 'x-igb-stale' /tmp/hdr-$cat; then
              day1=$(echo "$body" | jq -r '.data.item[0].day1' | grep -o '[0-9]*/[0-9]*' || true)
              echo "::warning::부류 $cat stale 모드 (데이터 날짜 $day1)"
              if [ -n "$day1" ]; then
                y=$(date -u -d '+9 hours' +%Y)
                age=$(( ( $(date -u -d '+9 hours' +%s) - $(date -u -d "$y-${day1/\//-}" +%s) ) / 86400 ))
                # 연말 롤오버(음수)면 작년으로 재계산
                [ "$age" -lt 0 ] && age=$(( ( $(date -u -d '+9 hours' +%s) - $(date -u -d "$((y-1))-${day1/\//-}" +%s) ) / 86400 ))
                [ "$age" -le 5 ] || { echo "::error::부류 $cat stale ${age}일 경과 — 상류 장기 장애"; fail=1; }
              fi
            fi
          done

          # 3) verdicts 신선도 — 매일 갱신, 49시간(한 번 건너뜀 허용) 넘으면 실패
          gen=$(curl -s -m 20 https://raw.githubusercontent.com/8illijey/igb/main/mobile/public/verdicts.json | jq -r .generatedAt)
          age_h=$(( ( $(date +%s) - $(date -d "$gen" +%s) ) / 3600 ))
          [ "$age_h" -lt 49 ] || { echo "::error::verdicts ${age_h}시간 묵음 — CI 확인 필요"; fail=1; }

          # 4) 평년(dpr7) 주입 — 2026-08-18 새벽, 가격은 멀쩡한데 평년만 통째로 비어
          #    홈 목록이 백지가 된 장애가 있었다. 홈은 '평년 대비 %'가 있는 품목만 추리기 때문이다.
          #    행 수만 보는 위 검사로는 안 잡혔으므로 평년이 실제로 채워졌는지 따로 본다.
          NORM_URL="https://igeobissa-recipes.designerxyzi.workers.dev/kamis?action=dailyPriceByCategoryList&p_product_cls_code=01&p_item_category_code=200&p_country_code=1101&p_regday=$today&p_convert_kg_yn=N&p_returntype=json"
          retry "curl -s -m 25 '$NORM_URL' | jq '[.data.item[] | select(.dpr7 != null and .dpr7 != \"-\" and .dpr7 != \"\")] | length' 2>/dev/null || echo 0" '[ "${v:-0}" -ge 20 ]' \
            || { echo "::error::채소류 평년(dpr7)이 ${v}행뿐 — baselines 주입 실패 의심"; fail=1; }

          # 5) baselines 신선도 — 주 1회 갱신이므로 10일까지 허용.
          bgen=$(curl -s -m 20 https://igeobissa.com/baselines.json | jq -r .generatedAt 2>/dev/null)
          if [ -n "$bgen" ] && [ "$bgen" != "null" ]; then
            bage=$(( ( $(date +%s) - $(date -d "$bgen" +%s) ) / 86400 ))
            [ "$bage" -lt 10 ] || { echo "::error::baselines ${bage}일 묵음 — 주간 CI 확인 필요"; fail=1; }
          else
            echo "::error::baselines.json을 읽지 못함"; fail=1
          fi

          # 6) series 신선도·분량 — 상세 '최근 시세' 차트의 사전계산. 이게 비면 상세가
          #    품목마다 KAMIS 1년치를 다시 받아(3~7초) 느려진다. verdicts와 같이 매일 갱신된다.
          sgen=$(curl -s -m 20 https://igeobissa.com/series.json | jq -r .generatedAt 2>/dev/null)
          if [ -n "$sgen" ] && [ "$sgen" != "null" ]; then
            sage=$(( ( $(date +%s) - $(date -d "$sgen" +%s) ) / 3600 ))
            [ "$sage" -lt 49 ] || { echo "::error::series ${sage}시간 묵음 — CI 확인 필요"; fail=1; }
            scount=$(curl -s -m 25 https://igeobissa.com/series.json | jq '.items | length' 2>/dev/null || echo 0)
            [ "${scount:-0}" -ge 60 ] || { echo "::error::series 품목이 ${scount}개뿐 — 생성 실패 의심"; fail=1; }
          else
            echo "::error::series.json을 읽지 못함"; fail=1
          fi

          # 7) 예약 실행 워치독 — GitHub cron이 밀리거나 통째로 누락되면(2026-08-28 실사고:
          #    당일 verdicts 예약이 22시까지 미실행 → 차트가 하루 종일 전날짜) 16시 이후에도
          #    오늘분 series가 없다. 여기서 verdicts CI를 직접 재발화한다(자가 치유).
          #    workflow_dispatch는 GITHUB_TOKEN 재귀 차단의 예외라 기본 토큰으로 가능.
          #    '오늘분'은 날짜만이 아니라 16시(KAMIS 갱신) 이후 생성인지까지 본다 —
          #    밀린 cron이 새벽에 돌면 날짜는 오늘인데 내용은 전날 데이터다.
          now_h=$(TZ=Asia/Seoul date +%-H)
          if [ "$now_h" -ge 16 ] && [ -n "$sgen" ] && [ "$sgen" != "null" ]; then
            if [ "$(TZ=Asia/Seoul date -d "$sgen" +%F)" != "$(TZ=Asia/Seoul date +%F)" ] \
              || [ "$(TZ=Asia/Seoul date -d "$sgen" +%-H)" -lt 16 ]; then
              echo "::warning::오늘분 verdicts 미생성(series generatedAt $sgen) — verdicts CI 재발화"
              gh workflow run verdicts.yml -R "$GITHUB_REPOSITORY" || echo "::error::verdicts 재발화 실패"
            fi
          fi

          exit $fail
